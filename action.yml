name: 'Asia Cooking & Recipe of the Day'
description: 'Injects authentic Asian recipes, wok tips, and ingredient guides into your README. Powered by Asiakochen.de.'
author: 'Asiakochen.de <kontakt@asiakochen.de>'
branding:
  icon: 'book-open'
  color: 'green'

inputs:
  readme-path:
    description: 'Path to the README file to update'
    required: false
    default: 'README.md'
  tag-start:
    description: 'Starting comment tag for injection'
    required: false
    default: '<!-- ASIA-RECIPE:START -->'
  tag-end:
    description: 'Ending comment tag for injection'
    required: false
    default: '<!-- ASIA-RECIPE:END -->'

runs:
  using: 'node20'
  main: 'index.js'
